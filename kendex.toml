schema = 7

[bot-instructions]
schema = 1

[bot-instructions.repo]
name = "vgshell"
summary = "VGS is a desktop shell for Hyprland on Quickshell 0.3.1. A small fixed core starts the shell, holds the instance lock, talks to Hyprland, hosts surfaces and loads plugins; every surface and service is a plugin with its own manifest and its own validation row."
tracker = "VGS"

[bot-instructions.bots]
# Setup evidence and remaining vendor checks: .bot-instructions/README.md.
codex = true
copilot = true
coderabbit = false
qodo = false
qodo_best_practices = false
qodo_review_md = false
macroscope = false

[bot-instructions.exclusions]
derive_render = true






[bot-instructions.doctrine.append]
scope = "Apply the local AGENTS.md for each changed path. The generated .github/instructions files hold additional path-specific review rules; read the files whose applyTo paths match the change."
severity = """
Review changes to the merge checks, scripts, review policy, the instance lock and the session lock, `vgshell plugin add` and the other plugin manager commands, and privileged operations in full depth. Privileged operations include elevation and writes outside the user's home wherever the code resides.
"""
declined = """
This personal project deliberately has no branch protection, merge queue, required review or commit/push guards, and no workflow that runs on a push or a pull request. Its two workflows run on main: .github/workflows/nightly.yml runs scripts/validate --full on a schedule for the areas a hosted runner can run and reports only, and .github/workflows/kendex-refresh.yml, adopted unedited from kendex, opens the kendex/refresh pull request with each package update, which merges at once. Reviews are optional. Direct pushes to main and immediate PR merges are supported. Do not request reinstating gates; local validation selects affected checks from the diff.
"""
no-preferences = """
The helper owns parsing and generation; a helper module split is separate work. Theme packages intentionally keep parallel per-theme app files. Agent instructions and architecture references do not require product README copies or release notes.
Plans, research reports, measurements and handoffs belong in tmp/ or on the owning tracker issue. Review bots must apply this repository artifact policy to proposed tracked documents.
Use the installed decider skill to judge whether this repository needs a decision record. A record preserves a choice that code cannot explain and that a later maintainer could otherwise reverse. Do not create a record only to restate the change.
"""

[[bot-instructions.surface]]
name = "qml"
globs = ["shell/**/*.qml", "shell/**/*.js"]
reviewer_only = true
instructions = """
Quickshell leaves the Qt.quit() and Qt.exit() signals unconnected. These calls do not terminate the shell. Qt.resolvedUrl() is correct for QML asset URLs. Use Quickshell.shellDir when a subprocess needs a filesystem path. FolderListModel treats a folder that is not there as the process's working directory rather than as an error, and reports the swap through its own folder property. Compare folder against the folder asked for before reading the listing. Process.exited precedes running becoming false. A command that fails to start emits no exited signal. A JS object passed to createObject as an initial property loses its functions and its nested arrays; hosts assign such properties after creation. The core under shell/ names no plugin and imports no plugin directory; scripts/check-plugin-boundary.py is the check."""

[[bot-instructions.surface]]
name = "plugins"
globs = ["shell/plugins/**"]
reviewer_only = true
instructions = """
A plugin is a directory with manifest.json in the schema shell/Core/PluginLogic.js judges and .agents/skills/vgs-plugin/references/api.md § Manifest describes; shell/Core/PluginLogic.js is the one judge of a manifest and a second validator is a twin. A plugin declares surfaces (kinds), never dependencies; an unknown manifest key is refused by design. A plugin imports qs.Commons, qs.Ui, Qt and Quickshell modules other than Quickshell.Wayland and QtQuick.Window (REFUSED_MODULES in scripts/check-plugin-boundary.py), and its own files; it names no window type and no other plugin. A core action reaches a plugin only through a capability named in the manifest's capabilities list. A bar owns the geometry of its sections and its own built-in widgets; the core mounts every plugin widget into its sections. A new plugin lands with its rows under scripts/smoke/rows/, read back from the built instance.
"""

[[bot-instructions.surface]]
name = "validation"
globs = ["scripts/**", "bin/**"]
reviewer_only = true
instructions = """
The scripts provide repository checks and regression tests. A failed tool invocation must not become an empty successful result; exit 77 names what could not run and is not a pass. Check that negative controls reach the intended failure.

scripts/validate is the manifest and scripts/qml-smoke.sh is the isolated runtime row. Never suggest qs -p shell against the live session or pkill quickshell; a second shell can black out the live desktop and other Quickshell applications share the session. The sandbox runtime dir must stay a short path under XDG_RUNTIME_DIR because Hyprland's socket path is limited. qs buffers redirected stdout; the per-instance log.log is the record.
"""

[[bot-instructions.surface]]
name = "agent-docs"
globs = ["AGENTS.md", "**/AGENTS.md", "docs/**"]
reviewer_only = true
instructions = """
Root and nested AGENTS.md files hold agent process instructions. docs/architecture contains agent references. AGENTS.local.md is a gitignored machine-local companion. Keep these separate from product documentation in README.md. Check instructions against code because agents execute their commands literally.
"""

[[bot-instructions.surface]]
name = "harness-config"
globs = ["kendex*.toml"]
reviewer_only = true
instructions = """
The agent-frontmatter and agent-skills tables contain kendex render configuration. Default model, effort and sandbox choices come from upstream. Check ownership before proposing a local change that refresh would replace. kendex.settings.toml holds public project defaults. Credentials belong in gitignored .env.local. A public setting is not itself evidence of a credential leak. Settings documentation belongs with the settings.
"""

[[bot-instructions.surface]]
name = "workflows"
globs = [".github/workflows/**"]
reviewer_only = true
instructions = "nightly.yml runs scripts/validate --full per area on a schedule and on a manual dispatch, and reports only. kendex-refresh.yml is kendex's shipped refresh workflow, adopted unedited through kendex's refresh/adopt-refresh.sh; do not ask for an edit to it. Do not add a push, pull_request or merge_group trigger, a required check or a merge gate unless the owner asks, and do not copy a check into a workflow: scripts/validate owns every check, with affected rows selected by the diff."

[[bot-instructions.surface]]
name = "arch-overview"
globs = ["shell/Core/**", "shell/Hosts/**", "shell/shell.qml", "shell/plugins/*/manifest.json", "bin/vgshell-scan", "bin/vgshell-plugin-judge"]
reviewer_only = true
instructions = "Read docs/architecture/overview.md before reviewing a change here. It governs plugin boundary: the core names no plugin, and a plugin reaches the core only through a host or a declared capability. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-configuration"
globs = ["config/**", "shell/Core/Config.qml", "shell/Commons/Paths.qml"]
reviewer_only = true
instructions = "Read docs/architecture/configuration.md before reviewing a change here. It governs configuration layers, their merge, their judge and every write to them. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-design-system"
globs = ["shell/Ui/**", "shell/Commons/**", "shell/plugins/**/*.qml"]
reviewer_only = true
instructions = "Read docs/architecture/design-system.md before reviewing a change here. It governs tokens, the theme judge, Theme, the qs.Ui components, pointer, keyboard and focus paths, Settings fields and text a user reads. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-runtime"
globs = ["bin/vgshell", "bin/lib/**", "shell/shell.qml", "shell/Core/**", "shell/plugins/*/Service.qml"]
reviewer_only = true
instructions = "Read docs/architecture/runtime.md before reviewing a change here. It governs starting, stopping and measuring the shell, IPC, watchers, pollers, caches and subprocesses. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-hyprland"
globs = ["shell/Core/HyprlandLayer.*", "shell/Core/HyprlandState.*", "shell/Core/Dispatch.js", "shell/Core/Compositor.qml", "shell/Core/KeyCapture.qml", "shell/Core/ShortcutRegistry.qml", "shell/Core/MonitorLogic.js", "bin/vgshell-hypr-judge"]
reviewer_only = true
instructions = "Read docs/architecture/hyprland.md before reviewing a change here. It governs the generated Hyprland layer, dispatches, the compositor link, shortcuts and key capture. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-commands-are-data"
globs = ["shell/Core/TuiRunner.qml", "shell/Core/TuiRecords.qml", "shell/Core/SystemSteps.qml", "shell/Core/PackageManagers.js", "shell/plugins/*/tui/**", "bin/vgshell-tui", "bin/vgshell-system", "bin/vgshell-pkg", "bin/vgshell-sudo-grant", "bin/lib/tui.sh", "bin/lib/pkg-run.sh"]
reviewer_only = true
instructions = "Read docs/architecture/commands-are-data.md before reviewing a change here. It governs the tui capability, floating TUIs, package steps, system steps and any place text could become a command. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-secrets"
globs = ["shell/Core/SecretWriter.qml", "shell/plugins/vgs.jarvis/backend/Secrets.js", "shell/plugins/vgs.network/**", "shell/plugins/vgs.vpn/**", "shell/plugins/vgs.polkit/**", "shell/plugins/vgs.lock/**", "shell/plugins/vgs.greeter/**", "shell/plugins/vgs.clipboard/**", "bin/vgshell-lock"]
reviewer_only = true
instructions = "Read docs/architecture/secrets.md before reviewing a change here. It governs password fields, stored tokens, clipboard secrets, credential probes and any text that could carry a secret. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-themes"
globs = ["themes/**", "bin/vgshell-theme-judge", "bin/vgshell-browser-policy", "bin/lib/theme-*.js", "shell/Core/ThemeRunner.qml", "shell/Hosts/BackgroundHost.qml", "shell/plugins/vgs.themes/**"]
reviewer_only = true
instructions = "Read docs/architecture/themes.md before reviewing a change here. It governs theme packages, their judge, theme targets, the theme runner and the backgrounds. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-distribution"
globs = ["packaging/**", "install.sh", "VERSION", "LICENSE", "flake.nix", "flake.lock", "bin/lib/self.js", "bin/lib/first-start.sh"]
reviewer_only = true
instructions = "Read docs/architecture/distribution.md before reviewing a change here. It governs the licence, VERSION, package recipes, the installer and vgshell self. Raise a finding where the change breaks one of its rules."

[[bot-instructions.surface]]
name = "arch-jarvis"
globs = ["shell/plugins/vgs.jarvis/**"]
reviewer_only = true
instructions = "Read docs/architecture/jarvis.md and docs/architecture/jarvis-outbound.md before reviewing a change here. They govern the Jarvis daemon, its wire, brains and tool executors and every path by which content or a credential leaves it. Raise a finding where the change breaks one of their rules."

[[bot-instructions.surface]]
name = "arch-validation"
globs = ["scripts/**"]
reviewer_only = true
instructions = "Read docs/architecture/validation.md before reviewing a change here. It governs scripts/validate, the rows and their verdicts, the nested sandbox and its harness, and the budgets. Raise a finding where the change breaks one of its rules."


