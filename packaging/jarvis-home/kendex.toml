# The Jarvis package as kendex installs it in a Jarvis home folder: a kendex
# project of its own, apart from this repository's development setup. VGS
# ships its render and copies it into a home made without kendex
# (shell/plugins/vgs.jarvis/backend/Home.js). The harnesses are the two whose
# folders a home manages; a home holds no link, so the render is a copy.
schema = 7

[sources.kendex]
repo = "vanillagreencom/kendex"
enabled = true

[install]
harnesses = ["claude", "codex"]
method = "copy"

[skills.jarvis]
source = "kendex"
enabled = true
